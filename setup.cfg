[tool:pytest]
testpaths =
    qiita_core
    qiita_db
    qiita_pet
    qiita_ware
addopts = -v

[coverage:run]
source = project_name
# Omit specific directories or files during measurement
omit =
    */test/*.py
    */tests/*.py
    */*/test/*.py
    */*/tests/*.py
    setup.py

[coverage:report]
# Omit files only from the generated report
omit =
    */test/*.py
    */tests/*.py
    */*/test/*.py
    */*/tests/*.py
    setup.py
