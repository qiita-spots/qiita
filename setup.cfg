[tool:pytest]
testpaths =
    qiita_core
    qiita_db
    qiita_pet
    qiita_ware
addopts = -v

[coverage:run]
source = project_name
# Omit specific directories or files during measurement
omit =
    */test/*
    */tests/*
    */*/test/*
    */*/tests/*
    setup.py

[coverage:report]
# Omit files only from the generated report
omit =
    */test/*
    */tests/*
    */*/test/*
    */*/tests/*
    setup.py
